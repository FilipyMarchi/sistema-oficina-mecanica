<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atualizar Mecânico</title>
    <link rel="stylesheet" href="estilo.css">
    <script type="text/javascript" src="mecanico.js"></script>
</head>
<body onload="carregarMecanicoDaUrl()">
    <h2>Atualizar mecânico</h2>

    <div class="formulario">
        <label for="nomeBusca">Digite o nome do mecânico que deseja atualizar</label>
        <div class="busca-linha">
            <input id="nomeBusca" type="text" value="" onkeydown="if (event.key === 'Enter') carregarMecanico()">
            <button onclick="carregarMecanico()">Buscar</button>
        </div>

        <div class="separador"></div>

        <label for="nome">Nome</label>
        <input id="nome" type="text" value="">
        <label for="telefone">Telefone</label>
        <input id="telefone" type="text" value="">
        <label for="cpf">CPF</label>
        <input id="cpf" type="text" value="">
        <label for="endereco">Endereço</label>
        <input id="endereco" type="text" value="">
        <label for="salario">Salário</label>
        <input id="salario" type="number" value="">
        <label for="especialidade">Especialidade</label>
        <input id="especialidade" type="text" value="">
        <button class="btn-enviar" onclick="atualizarMecanico()">Atualizar</button>
    </div>

    <button class="btn-voltar" onclick="window.location.href='MenuMecanico.html'">&lt;&lt; Voltar</button>
</body>
</html>
