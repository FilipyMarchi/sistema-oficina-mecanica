<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscar Mecânico</title>
    <link rel="stylesheet" href="estilo.css">
    <script type="text/javascript" src="mecanico.js"></script>
</head>
<body>
    <h2>Buscar mecânico pelo nome</h2>

    <div class="formulario">
        <label for="nomeBusca">Nome</label>
        <div class="busca-linha">
            <input id="nomeBusca" type="text" value="" onkeydown="if (event.key === 'Enter') buscarMecanico()">
            <button onclick="buscarMecanico()">Buscar</button>
        </div>
    </div>

    <div id="resultado"></div>

    <button class="btn-voltar" onclick="window.location.href='MenuMecanico.html'">&lt;&lt; Voltar</button>
</body>
</html>
