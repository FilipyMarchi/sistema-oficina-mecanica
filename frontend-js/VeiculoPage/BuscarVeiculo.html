<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscar Veículo</title>
    <link rel="stylesheet" href="estilo.css">
    <script type="text/javascript" src="veiculo.js"></script>
</head>
<body>
    <h2>Buscar veículo pela placa</h2>
 
    <div class="formulario">
        <label for="placaBusca">Placa</label>
        <div class="busca-linha">
            <input id="placaBusca" type="text" value="" onkeydown="if (event.key === 'Enter') buscarVeiculo()">
            <button onclick="buscarVeiculo()">Buscar</button>
        </div>
    </div>
 
    <div id="resultado"></div>
 
    <button class="btn-voltar" onclick="window.location.href='MenuVeiculo.html'">&lt;&lt; Voltar</button>
</body>
</html>
